# Hun (mihomo) TUN 模式代理默认配置
# 引擎: MetaCubeX Mihomo — https://github.com/MetaCubeX/mihomo
# 文档: https://wiki.metacubex.one/

# 日志级别: silent / error / warning / info / debug
log-level: info
# 不设 log-file —— 由 init 脚本把输出重定向到 /var/log/hun.log

# ── 本地入站（仅供本机调试；代理流量走 TUN）──
mixed-port: 7890
allow-lan: false
bind-address: '127.0.0.1'

# ── 管理 API（仅监听回环；需要远程管理时改成 0.0.0.0:9090 并配 secret）──
external-controller: 127.0.0.1:9090
# external-ui: ui
# secret: "改一个随机字符串"

# ── TUN 模式 ─────────────────────────────────────────────────────
# mihomo 自行创建 utun、添加策略路由，只接管路由器本机流量
# （LAN 客户端不受影响，透明代理整网请勿选此模式）
tun:
  enable: true
  device: utun
  stack: mixed
  auto-route: true            # mihomo 自动添加策略路由
  auto-redirect: false
  auto-detect-interface: true # 自动检测默认出口网卡
  dns-hijack:
    - any:53
    - tcp://any:53
  mtu: 9000
  strict-route: false

# ── DNS ───────────────────────────────────────────────────────────
dns:
  enable: true
  ipv6: false
  listen: 127.0.0.1:1053      # 劫持到的 DNS 在内部处理；本机 53 留给 dnsmasq
  enhanced-mode: redir-host
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  fallback:
    - 8.8.8.8
    - 1.1.1.1
  fallback-filter:
    geoip: false
    geoip-code: CN

# ── Geo 数据 ──────────────────────────────────────────────────────
# 包依赖 v2ray-geoip/v2ray-geosite，init 会把 /usr/share/v2ray/*.dat
# 软链到运行目录 /etc/hun/；geodata-mode 让 GEOIP 规则读 geoip.dat
geodata-mode: true
geo-auto-update: false

# ── 代理组 ────────────────────────────────────────────────────────
# 添加订阅后把节点/策略组挂到 Select，或直接用 rule-provider
proxy-groups:
  - name: Select
    type: select
    proxies:
      - DIRECT

# ── 规则：国内直连，其余走 Select（默认 Select 只有 DIRECT=纯直连）──
rules:
  - GEOIP,private,DIRECT
  - GEOSITE,geolocation-cn,DIRECT
  - GEOIP,cn,DIRECT
  - MATCH,Select
